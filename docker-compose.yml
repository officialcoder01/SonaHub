services:
  db:
    image: postgres:16
    container_name: multi_vendor_postgres
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h localhost -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multi_vendor_app
    user: root
    working_dir: /workspace/backend
    command: sh -c "npm run prisma:generate && npm run dev"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB_TEST}
      PORT: ${PORT:-3000}
    volumes:
      - ./backend:/workspace/backend
      - backend_node_modules:/workspace/backend/node_modules
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multi_vendor_frontend
    user: root
    working_dir: /app
    command: sh -c "test -x node_modules/.bin/vite && node -e \"const deps=require('./package.json').devDependencies; const vite=require('./node_modules/vite/package.json').version; require.resolve('tailwindcss'); require.resolve('postcss'); require.resolve('autoprefixer'); if (!vite.startsWith(deps.vite.replace(/^[^0-9]*/, '').split('.')[0] + '.')) process.exit(1)\" >/dev/null 2>&1 || npm install --no-audit --no-fund; npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app

volumes:
  pgdata:
  frontend_node_modules:
  backend_node_modules:
