<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SonaHub System Architecture</title>
  <desc id="desc">System architecture showing React frontend, Express REST API, PostgreSQL database, and Cloudinary image storage.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .label { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .frontend { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; }
      .api { fill: #dcfce7; stroke: #4ade80; stroke-width: 2; }
      .db { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .cloud { fill: #fce7f3; stroke: #ec4899; stroke-width: 2; }
      .line { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .dotted { stroke: #475569; stroke-width: 2.5; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .tag { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .pill { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#f8fafc"/>

  <text x="800" y="60" text-anchor="middle" class="title">SonaHub System Architecture</text>

  <!-- Frontend -->
  <rect x="80" y="150" width="300" height="420" class="box frontend"/>
  <text x="230" y="185" text-anchor="middle" class="section">React Frontend</text>
  <text x="230" y="220" text-anchor="middle" class="label">Vite + React + Tailwind</text>

  <rect x="120" y="255" width="220" height="66" class="pill"/>
  <text x="230" y="295" text-anchor="middle" class="small">Public marketplace</text>

  <rect x="120" y="340" width="220" height="66" class="pill"/>
  <text x="230" y="380" text-anchor="middle" class="small">Vendor dashboard</text>

  <rect x="120" y="425" width="220" height="66" class="pill"/>
  <text x="230" y="465" text-anchor="middle" class="small">Auth &amp; bookings</text>

  <rect x="120" y="510" width="220" height="66" class="pill"/>
  <text x="230" y="550" text-anchor="middle" class="small">Service detail pages</text>

  <!-- API -->
  <rect x="470" y="150" width="380" height="420" class="box api"/>
  <text x="660" y="185" text-anchor="middle" class="section">Express REST API</text>
  <text x="660" y="220" text-anchor="middle" class="label">TypeScript / Express 5</text>

  <rect x="520" y="255" width="280" height="72" class="pill"/>
  <text x="660" y="285" text-anchor="middle" class="small">Routes &amp; validation</text>
  <text x="660" y="308" text-anchor="middle" class="small">Auth, Services, Vendors, Bookings</text>

  <rect x="520" y="345" width="280" height="72" class="pill"/>
  <text x="660" y="375" text-anchor="middle" class="small">Controllers</text>
  <text x="660" y="398" text-anchor="middle" class="small">HTTP request handling</text>

  <rect x="520" y="435" width="280" height="72" class="pill"/>
  <text x="660" y="465" text-anchor="middle" class="small">Services + Prisma</text>
  <text x="660" y="488" text-anchor="middle" class="small">Business logic + DB access</text>

  <!-- Database -->
  <rect x="980" y="150" width="300" height="420" class="box db"/>
  <text x="1130" y="185" text-anchor="middle" class="section">PostgreSQL</text>
  <text x="1130" y="220" text-anchor="middle" class="label">Primary application database</text>

  <rect x="1015" y="260" width="230" height="58" class="pill"/>
  <text x="1130" y="297" text-anchor="middle" class="small">Users</text>

  <rect x="1015" y="330" width="230" height="58" class="pill"/>
  <text x="1130" y="367" text-anchor="middle" class="small">Vendor profiles</text>

  <rect x="1015" y="400" width="230" height="58" class="pill"/>
  <text x="1130" y="437" text-anchor="middle" class="small">Services &amp; bookings</text>

  <rect x="1015" y="470" width="230" height="58" class="pill"/>
  <text x="1130" y="507" text-anchor="middle" class="small">Reviews &amp; categories</text>

  <!-- Cloudinary -->
  <rect x="570" y="630" width="460" height="170" class="box cloud"/>
  <text x="800" y="665" text-anchor="middle" class="section">Cloudinary Image Storage</text>
  <text x="800" y="700" text-anchor="middle" class="label">Stores uploaded service photos</text>

  <rect x="635" y="725" width="330" height="52" class="pill"/>
  <text x="800" y="758" text-anchor="middle" class="small">Secure URLs returned to PostgreSQL</text>

  <!-- User browser -->
  <rect x="80" y="640" width="290" height="120" class="pill"/>
  <text x="225" y="690" text-anchor="middle" class="section">User / Browser</text>
  <text x="225" y="720" text-anchor="middle" class="small">Accesses React app over HTTP</text>

  <!-- arrows -->
  <line x1="380" y1="360" x2="470" y2="360" class="line"/>
  <line x1="850" y1="360" x2="980" y2="360" class="line"/>
  <line x1="660" y1="570" x2="660" y2="630" class="dotted"/>
  <line x1="800" y1="630" x2="800" y2="570" class="dotted"/>
  <line x1="370" y1="700" x2="570" y2="700" class="dotted"/>

  <!-- labels -->
  <g>
    <rect x="394" y="305" width="150" height="34" class="tag"/>
    <text x="469" y="327" text-anchor="middle" class="small">REST API calls</text>
  </g>
  <g>
    <rect x="874" y="305" width="90" height="34" class="tag"/>
    <text x="919" y="327" text-anchor="middle" class="small">Prisma</text>
  </g>
  <g>
    <rect x="690" y="596" width="140" height="34" class="tag"/>
    <text x="760" y="618" text-anchor="middle" class="small">Uploads</text>
  </g>
  <g>
    <rect x="760" y="596" width="170" height="34" class="tag"/>
    <text x="845" y="618" text-anchor="middle" class="small">Image URLs</text>
  </g>
  <g>
    <rect x="395" y="676" width="155" height="34" class="tag"/>
    <text x="472" y="698" text-anchor="middle" class="small">Browser access</text>
  </g>
</svg>
